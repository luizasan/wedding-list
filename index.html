  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Presentes — Luiza &amp; Alan</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f4eee3;
      --paper: #fbf8f1;
      --ink: #4c382c;
      --soft-ink: #7d6655;
      --line: #d8c6ae;
      --clay: #9b6c50;
      --clay-dark: #784a35;
      --sage: #87917b;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      font-family: "Work Sans", sans-serif;
      color: var(--ink);
      background: var(--cream);
    }

    .page-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow-x: hidden;
      overflow-y: visible;
      padding: 28px 20px 44px;
      background:
        radial-gradient(circle at 7% 12%, rgba(190, 163, 125, 0.13) 0 2px, transparent 3px),
        radial-gradient(circle at 93% 83%, rgba(190, 163, 125, 0.12) 0 2px, transparent 3px),
        #f4eee3;
    }

    .page-shell::before,
    .page-shell::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      border: 1px solid rgba(155, 108, 80, 0.13);
      border-radius: 50%;
      pointer-events: none;
    }

    .page-shell::before { top: -245px; left: -180px; }
    .page-shell::after { right: -215px; bottom: -255px; }

    .main-content {
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .couple-mark {
      font-family: "Libre Baskerville", serif;
      font-size: 0.78rem;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      color: var(--soft-ink);
      text-align: center;
      margin: 8px 0 12px;
    }

    .botanical-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: var(--sage);
      margin: 0 auto 20px;
    }

    .botanical-divider::before,
    .botanical-divider::after {
      content: "";
      display: block;
      width: 55px;
      height: 1px;
      background: #b8b09d;
    }

    .hero {
      text-align: center;
      max-width: 670px;
      margin: 0 auto 42px;
      animation: rise-in 0.8s ease both;
    }

    .hero h1 {
      font-family: "Libre Baskerville", serif;
      margin: 0;
      color: var(--ink);
      line-height: 1.18;
    }

    .hero p {
      margin: 0 auto;
      max-width: 550px;
      line-height: 1.75;
      color: var(--soft-ink);
    }

    .gift-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      width: 100%;
      margin-bottom: 42px;
    }

    .gift-card {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 27px;
      position: relative;
      width: 100%;
      min-height: 215px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      animation: rise-in 0.7s ease both;
    }

    .gift-card:nth-child(2) { animation-delay: 80ms; }
    .gift-card:nth-child(3) { animation-delay: 160ms; }
    .gift-card:nth-child(4) { animation-delay: 240ms; }

    .gift-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 13px 28px rgba(85, 55, 36, 0.10);
      border-color: #b59476;
    }

    .gift-card.is-selected {
      border: 2px solid var(--clay);
      box-shadow: 0 13px 28px rgba(85, 55, 36, 0.13);
    }

    .gift-number {
      font-family: "Libre Baskerville", serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--clay);
      margin-bottom: 18px;
    }

    .gift-name {
      font-family: "Libre Baskerville", serif;
      line-height: 1.35;
      margin: 0;
    }

    .gift-description {
      color: var(--soft-ink);
      line-height: 1.65;
      margin: 11px 0 24px;
      flex: 1;
    }

    .gift-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 2px;
      padding: 12px 17px;
      cursor: pointer;
      font-family: "Work Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background 180ms ease, transform 180ms ease;
    }

    .gift-action:hover { transform: translateY(-1px); }
    .gift-action:focus-visible,
    .copy-button:focus-visible,
    .back-button:focus-visible,
    .pix-input:focus-visible {
      outline: 3px solid rgba(120, 74, 53, 0.35);
      outline-offset: 3px;
    }

    .selected-state {
      display: none;
      align-items: center;
      gap: 7px;
      color: #567050;
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 43px;
    }

    .gift-card.is-selected .gift-action { display: none; }
    .gift-card.is-selected .selected-state { display: inline-flex; }

    .pix-section {
      max-width: 790px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 38px;
      text-align: center;
      position: relative;
      animation: rise-in 0.7s ease 0.32s both;
    }

    .pix-leaf {
      position: absolute;
      color: rgba(135, 145, 123, 0.68);
    }

    .pix-leaf.left { left: 22px; top: 20px; transform: rotate(-22deg); }
    .pix-leaf.right { right: 22px; bottom: 20px; transform: rotate(157deg); }

    .pix-section h1 {
      font-family: "Libre Baskerville", serif;
      margin: 0;
      line-height: 1.3;
    }

    .pix-section p {
      margin: 14px auto 25px;
      max-width: 570px;
      line-height: 1.7;
      color: var(--soft-ink);
    }

    .pix-form {
      width: 100%;
      max-width: 590px;
      margin: 0 auto;
    }

    .pix-label {
      display: block;
      font-size: 0.78rem;
      text-align: left;
      margin-bottom: 8px;
      color: var(--ink);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .pix-row {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .pix-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cdbca8;
      border-radius: 2px;
      padding: 13px 14px;
      font-family: "Work Sans", sans-serif;
      font-size: 0.93rem;
      color: var(--ink);
      background: #fffdf9;
    }

    .pix-input::placeholder { color: #a6917e; }

    .pix-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      width: 100%;
      gap: 10px;
    }

    .pix-key {
      display: flex;
      align-items: center;
      flex: 0 1 auto;
      width: max-content;
      max-width: 100%;
      min-width: 0;
      border: 1px solid #cdbca8;
      border-radius: 8px;
      padding: 13px 17px;
      font-family: "Work Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .copy-button,
    .back-button {
      border: 0;
      border-radius: 2px;
      padding: 13px 17px;
      cursor: pointer;
      font-family: "Work Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 180ms ease, transform 180ms ease;
    }

    .copy-button:hover,
    .back-button:hover { transform: translateY(-1px); }

    .status-message {
      min-height: 24px;
      margin: 12px 0 0;
      font-size: 0.86rem;
      color: var(--soft-ink);
    }

    .bottom-actions {
      display: flex;
      justify-content: center;
      margin-top: 32px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .page-shell { padding: 22px 16px 34px; }
      .hero { margin-bottom: 30px; }
      .gift-grid { grid-template-columns: 1fr; gap: 14px; margin-bottom: 30px; }
      .gift-card { min-height: auto; padding: 23px; }
      .pix-section { padding: 31px 20px; }
      .pix-row { gap: 7px; }
      .pix-key { padding: 12px 10px; font-size: 0.78rem; }
      .copy-button { flex: 0 0 auto; padding: 12px 11px; font-size: 0.78rem; }
      .pix-leaf { display: none; }
    }
  </style>

 <body data-template-id="__page-root" style="background: rgb(244, 238, 227);">
  <div class="page-shell">
   <header class="main-content" aria-label="Identificação do casal">
    <p data-template-id="couple-name" class="canva-text couple-mark" style="color: rgb(125, 102, 85); font-weight: 400; font-style: normal; font-size: 13px; letter-spacing: 0.14rem;">Luiza &amp; Alan</p>
    <div class="botanical-divider" aria-hidden="true">
     <i data-lucide="sprout" style="width:18px;height:18px;"></i>
    </div>
   </header>
   <main class="main-content">
    <section class="hero" aria-label="Mensagem de agradecimento">
     <p data-template-id="intro-text" class="canva-text" style="color: rgb(125, 102, 85); font-weight: 400; font-style: normal; font-size: 16px; line-height: 1.75;">Agradecemos com carinho por fazer parte deste momento tão especial.</p>
    </section>
    <section class="gift-grid" aria-label="Formas de presentear">
     <article data-template-id="gift-list-card" class="canva-card gift-card" style="background: rgb(251, 248, 241);">
      <p data-template-id="gift-list-label" class="canva-text gift-number" style="color: rgb(155, 108, 80); font-weight: 400; font-style: normal; font-size: 13px;">Opção 1</p>
      <p data-template-id="gift-list-description" class="canva-text gift-description" style="color: rgb(125, 102, 85); font-weight: 400; font-style: normal; font-size: 16px; line-height: 1.65;">Escolha seu presente na nossa lista oficial.</p><a data-template-id="gift-list-link" class="canva-button gift-action" href="https://www.finalfeliz.de/luiza-e-alan" target="_blank" rel="noopener noreferrer" style="background: rgb(155, 108, 80); color: rgb(255, 255, 255); font-weight: 600; font-style: normal; font-size: 14px;">Acessar lista de presentes</a>
      <p data-template-id="gift-list-note" class="canva-text link-note" aria-live="polite" style="color: rgb(125, 102, 85); font-size: 13px;"></p>
     </article>
     <article data-template-id="pix-card" class="canva-card gift-card" style="background: rgb(251, 248, 241);">
      <p data-template-id="pix-label" class="canva-text gift-number" style="color: rgb(135, 145, 123); font-weight: 400; font-style: normal; font-size: 13px;">Opção 2</p>
      <h1 data-template-id="pix-title" class="canva-text gift-name" style="color: rgb(76, 56, 44); font-weight: 400; font-style: normal; font-size: 24px;">Presente via Pix</h1>
      <p data-template-id="pix-description" class="canva-text gift-description" style="color: rgb(125, 102, 85); font-weight: 400; font-style: normal; font-size: 16px; line-height: 1.65;">Se preferir, você também pode nos presentear via Pix.</p>
      <div class="pix-row">
       <div data-template-id="pix-key" class="canva-input pix-key" style="background: rgb(244, 238, 227); color: rgb(76, 56, 44); font-weight: 600; font-style: normal; font-size: 14px;">alnflp01@gmail.com</div><button data-template-id="copy-button" class="canva-button copy-button" type="button" aria-describedby="pix-note" style="background: rgb(155, 108, 80); color: rgb(255, 255, 255); font-weight: 600; font-style: normal; font-size: 14px;">Copiar</button>
      </div>
      <p data-template-id="pix-note" class="canva-text link-note" aria-live="polite" style="color: rgb(125, 102, 85); font-size: 13px;"></p>
     </article>
    </section>
   </main>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
      document.querySelectorAll(".gift-action").forEach(function (link) {
        link.addEventListener("click", function () {
          const message = link.parentElement.querySelector(".link-note");
          message.textContent = "Acesso selecionado. Substitua o destino pelo link real antes de publicar.";
        });
      });

      const copyButton = document.querySelector(".copy-button");
      copyButton.addEventListener("click", async function () {
        const message = copyButton.closest(".gift-card").querySelector(".link-note");
        try {
          await navigator.clipboard.writeText("alnflp01@gmail.com");
          message.textContent = "Chave copiada!";
        } catch (error) {
          message.textContent = "Não foi possível copiar a chave Pix.";
        }
      });
    });
  </script>
